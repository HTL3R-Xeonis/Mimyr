# LLM benchmark, GitHub Models part (goal H8A) - same prompts and settings as benchmark_config.yml.
# The key comes from GITHUB_MODELS_KEY in the generator's .env; model ids are "publisher/name" as listed by
# https://models.github.ai/catalog/models. A model the account cannot use (403/404) is recorded once and skipped.
# Free-tier rate limits are strict, hence the pause.
runs: 2
temperature: 0.2
timeout: 900
gns3_live:
  host: 10.20.20.227
  port: 80
models:
- label: gpt-4.1-mini (github)
  type: openai
  base_url: https://models.github.ai/inference
  model: openai/gpt-4.1-mini
  api_key_env: GITHUB_MODELS_KEY
  pause_seconds: 8
- label: gpt-4.1 (github)
  type: openai
  base_url: https://models.github.ai/inference
  model: openai/gpt-4.1
  api_key_env: GITHUB_MODELS_KEY
  pause_seconds: 8
- label: Llama-3.3-70B (github)
  type: openai
  base_url: https://models.github.ai/inference
  model: meta/Llama-3.3-70B-Instruct
  api_key_env: GITHUB_MODELS_KEY
  pause_seconds: 8
- label: DeepSeek-V3 (github)
  type: openai
  base_url: https://models.github.ai/inference
  model: deepseek/DeepSeek-V3-0324
  api_key_env: GITHUB_MODELS_KEY
  pause_seconds: 8
- label: Phi-4 (github)
  type: openai
  base_url: https://models.github.ai/inference
  model: microsoft/Phi-4
  api_key_env: GITHUB_MODELS_KEY
  pause_seconds: 8
- label: Mistral-Small (github)
  type: openai
  base_url: https://models.github.ai/inference
  model: mistral-ai/mistral-small-2503
  api_key_env: GITHUB_MODELS_KEY
  pause_seconds: 8
prompts:
- id: P1
  text: Create a small topology with one router and two PCs connected through a switch.
- id: P2
  text: 'Build a small office network: one router, one switch, two PCs and one Linux
    server VM that hosts a web server.'
- id: P3
  text: 'Build a company network with a firewall that separates three zones: an internal
    LAN with two switches and four PCs, a DMZ with a web server VM and a file server
    VM, and an uplink to the internet through a router.'
- id: P4
  text: Create a campus topology with two routers connected to each other, each router
    with its own switch, three PCs per switch, plus one Linux server VM and one Windows
    server VM on the second switch, linked redundantly where possible.
