# Config for the Topology Generator.
# After making changes: restart the container, or call
# POST /api/reload-config if the API is already running.

gns3_api_url: http://10.20.20.171:8001
template_api_url: http://10.20.20.171:8000

# Multiple Ollama servers are supported. They are tried in order - as
# soon as one responds successfully, its result is used. Acts as a
# fallback in case a server is down or overloaded.
ollama_servers:
  - name: ollama-1
    url: http://10.20.20.81:11434
    model: granite4.1:8b

  - name: ollama-2
    url: http://10.20.20.85:11434
    model: granite4.1:8b

  - name: ollama-3
    url: http://10.20.20.182:11434
    model: granite4.1:8b

  # Add another server:
  # - name: ollama-4
  #   url: http://10.20.20.82:11434
  #   model: llama3.1:8b

  # Hosted LLMs with a free tier: type "openai" = any server speaking the
  # OpenAI chat-completions API. The API key is NOT written here - put it in
  # the file `.env` next to docker-compose.yml (e.g. GEMINI_API_KEY=...) and
  # name that variable in `api_key_env`. A server whose key is missing or
  # that answers with an error (rate limit 429, ...) is skipped and the next
  # one in this list is tried. Model names change often - check the
  # provider's current list. Free tiers can use your prompts for training:
  # the prompts here contain only your topology request and the device
  # catalog, but don't paste anything confidential into a request.
  #
  # - name: gemini
  #   type: openai
  #   base_url: https://generativelanguage.googleapis.com/v1beta/openai
  #   model: gemini-3.8-flash
  #   api_key_env: GEMINI_API_KEY
  #   # Free-tier Gemini 3.8 Flash needs minutes per topology (5 min once; another try with
  #   # extra_body {reasoning_effort: low} got no answer at all) - fine as a last-resort fallback only.
  #
  # - name: groq
  #   type: openai
  #   base_url: https://api.groq.com/openai/v1
  #   model: llama-3.3-70b-versatile
  #   api_key_env: GROQ_API_KEY
  #
  # - name: openrouter
  #   type: openai
  #   base_url: https://openrouter.ai/api/v1
  #   model: meta-llama/llama-3.3-70b-instruct:free
  #   api_key_env: OPENROUTER_API_KEY
  #   # optional: temperature: 0.2, max_tokens: 4000, headers: {X-Title: topology-generator}

# How many times to retry if the LLM doesn't produce valid output (e.g.
# wrong format, unknown image, broken YAML). Each attempt starts again
# at ollama_servers[0], except for servers already marked unreachable in
# an earlier attempt of the same request.
max_retries: 3

# Timeout for a single Ollama generation request (seconds). Should be
# generous given the limited hardware.
request_timeout: 500

# Timeout for internal API calls (GNS3 Template API, NFS Template API).
api_timeout: 15

# Paths relative to this config directory.
prompt_template_file: prompt_template.txt
example_topology_file: example_topology.yml
