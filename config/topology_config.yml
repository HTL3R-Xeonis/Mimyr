# Config for Mimyr (formerly TopologyGenerator), the topology generator.
# After making changes: restart the container, or call
# POST /api/reload-config if the API is already running.

gns3_api_url: http://10.20.20.171:8001
template_api_url: http://10.20.20.171:8000

# LLM servers, tried in order - as soon as one responds successfully, its result is used; a server that is
# down, overloaded, rate-limited or without its API key is skipped and the next one is tried.
# The order follows the benchmark (diploma goal H8A, same prompts for every model, valid = passes the generator's
# own validation): gemini-3.5-flash-lite 1.1 s mean 8/8 valid, gemini-3.5-flash 13.3 s 8/8, granite4.1:8b 114 s 6/8,
# everything else local 0 valid. So the hosted Gemini models come first and the local Ollama servers are only the
# fallback for when the hosted ones are not reachable or the free-tier limit is used up.
# Hosted: the API key is NOT written here - it is GEMINI_API_KEY in the file `.env` next to docker-compose.yml.
# Free tiers can use prompts for training: the prompt contains only the topology request and the device catalog,
# but do not paste anything confidential into a request.
ollama_servers:
  - name: gemini-flash-lite
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash-lite
    api_key_env: GEMINI_API_KEY

  - name: gemini-flash
    type: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY

  # Local fallback (granite4.1:8b: 6 of 8 valid, about two minutes per topology)
  - name: ollama-1
    url: http://10.20.20.81:11434
    model: granite4.1:8b

  - name: ollama-2
    url: http://10.20.20.85:11434
    model: granite4.1:8b

  - name: ollama-3
    url: http://10.20.20.182:11434
    model: granite4.1:8b

  # Add another server:
  # - name: ollama-4
  #   url: http://10.20.20.82:11434
  #   model: llama3.1:8b

  # More hosted servers (type "openai" = anything speaking the OpenAI chat-completions API; model names change
  # often - check the provider's list):
  #
  # - name: groq
  #   type: openai
  #   base_url: https://api.groq.com/openai/v1
  #   model: llama-3.3-70b-versatile
  #   api_key_env: GROQ_API_KEY
  #
  # - name: openrouter
  #   type: openai
  #   base_url: https://openrouter.ai/api/v1
  #   model: meta-llama/llama-3.3-70b-instruct:free
  #   api_key_env: OPENROUTER_API_KEY
  #   # optional: temperature: 0.2, max_tokens: 4000, headers: {X-Title: topology-generator}

# How many times to retry if the LLM doesn't produce valid output (e.g.
# wrong format, unknown image, broken YAML). Each attempt starts again
# at ollama_servers[0], except for servers already marked unreachable in
# an earlier attempt of the same request.
max_retries: 3

# Timeout for a single Ollama generation request (seconds). Should be
# generous given the limited hardware.
request_timeout: 500

# Timeout for internal API calls (GNS3 Template API, NFS Template API).
api_timeout: 15

# Paths relative to this config directory.
prompt_template_file: prompt_template.txt
example_topology_file: example_topology.yml
