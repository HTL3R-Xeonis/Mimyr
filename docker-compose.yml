services:
  # Mimyr (formerly TopologyGenerator). The service and container name stay topology-generator on purpose.
  topology-generator:
    build:
      context: .
      dockerfile: topology.Dockerfile
    container_name: topology-generator
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      # Contains topology_config.yml, prompt_template.txt, example_topology.yml
      - ./config:/config:ro
    # API keys for hosted LLM servers (see config/topology_config.yml) - the
    # file is optional and must never be committed.
    env_file:
      - path: .env
        required: false
    environment:
      - CONFIG_PATH=/config/topology_config.yml
