# Release workflow. It runs only when a tag v* is pushed (nothing else starts it): the tests and
# ruff must pass and the tag must equal the version in VERSION, then the source
# tarball and its checksum are attached to a new GitHub Release (notes are generated).
# The assets of a public repository are downloadable without a token.
name: Release

on:
  push:
    tags:
      - "v*"

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  COMPONENT: Mimyr
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Gates (tag, tests, ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag name only reaches the shell as an environment variable, never pasted into the script.
      - name: The tag equals the version in VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          version="${TAG#v}"
          if [[ "$TAG" != v* || ! "$version" =~ $semver ]]; then
            echo "::error::The tag must look like vX.Y.Z or vX.Y.Z-rc.N (SemVer)."
            exit 1
          fi
          file_version="$(cat VERSION)"
          if [[ "$file_version" != "$version" ]]; then
            echo "::error::The tag says $version but VERSION says $file_version."
            exit 1
          fi
          echo "Releasing $COMPONENT $version"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1 ruff

      - name: Execute tests with pytest
        run: python -m pytest tests

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --output-format=github --diff --check .

  release:
    name: Build assets and create the GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # only to create the release and attach the assets

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the tags and the history, for the release notes
          persist-credentials: false

      - name: Build the source tarball and its SHA-256
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="${COMPONENT}-${version}"
          mkdir dist
          git archive --format=tar.gz --prefix="${name}/" --output="dist/${name}.tar.gz" HEAD
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" && sha256sum --check "${name}.tar.gz.sha256")
          ls -l dist

      - name: Write the release notes from the commits since the previous release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # the commits between the previous release tag and this one (direct pushes included, not only merged pull requests)
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          {
            if [[ -n "$previous" ]]; then
              echo "Changes since ${previous}:"
              range="${previous}..${TAG}"
            else
              echo "First release, all changes so far:"
              range="${TAG}"
            fi
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
            if [[ -n "$previous" ]]; then
              echo
              echo "Full comparison: https://github.com/${REPO}/compare/${previous}...${TAG}"
            fi
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="${COMPONENT}-${version}"
          flags=(--verify-tag --notes-file dist/RELEASE_NOTES.md --title "$TAG")
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" "dist/${name}.tar.gz" "dist/${name}.tar.gz.sha256"
